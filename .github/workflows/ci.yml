name: Mobile Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1️ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️ Setup Java 17 (necessário para Android SDK)
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 4️ Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 5️ Instalar Appium globalmente
      - name: Install Appium
        run: npm install -g appium

      # 6️ Instalar ou atualizar driver uiautomator2
      - name: Update UIAutomator2 Driver
        run: |
          appium driver update uiautomator2 || appium driver install uiautomator2

      # 7️ Setup Android SDK e licenças
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          target: android-30
          arch: x86
          force-accept-licenses: true

      # 8 Instalar System Image x86
      - name: Install Android System Image
        run: sdkmanager "system-images;android-30;google_apis;x86"

      # 9️ Criar AVD (emulador)
      - name: Create Android Emulator
        run: echo no | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86" --force

      # 10 Iniciar emulador
      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          force-avd-creation: true
          emulator-options: "-no-window -gpu swiftshader_indirect"

      # 1️1️ Rodar testes no Android
      - name: Run Android Tests
        run: npx wdio run wdio.conf.js --platform android --device emulator

      # 1️2️ Gerar Allure Report
      - name: Generate Allure Report
        run: |
          npx allure generate allure-results --clean -o allure-report
          npx allure open -p 3000 allure-report

  ios-simulator-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # 1️ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️ Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 4️ Instalar Appium globalmente
      - name: Install Appium
        run: npm install -g appium

      # 5 Instalar XCUITest Driver
      - name: Install XCUITest Driver
        run: |
          appium driver update xcuitest || appium driver install xcuitest

      # 6 Boot IOS Simulator
      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 14" || true
          xcrun simctl bootstatus "iPhone 14" -b

      # 7 Rodar testes no iOS Simulator
      - name: Run iOS Tests
        run: npx wdio run wdio.conf.js --platform ios --device simulator

      # 8 Gerar Allure Report
      - name: Generate Allure Report
        run: |
          npx allure generate allure-results --clean -o allure-report
          npx allure open -p 3000 allure-report
