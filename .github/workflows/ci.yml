name: Mobile Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-tests:
    runs-on: ubuntu-latest
    env:
      PLATFORM: android
      DEVICE: emulator

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 4️⃣ Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 5️⃣ Instalar Appium globalmente
      - name: Install Appium
        run: npm install -g appium

      # 6️⃣ Atualizar driver UIAutomator2
      - name: Update UIAutomator2 Driver
        run: appium driver update uiautomator2 || appium driver install uiautomator2

      # 7️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          target: android-30
          arch: x86
          force-accept-licenses: true

      # 8️⃣ Instalar System Image x86
      - name: Install Android System Image
        run: sdkmanager "system-images;android-30;google_apis;x86"

      # 9️⃣ Criar AVD (emulador)
      - name: Create Android Emulator
        run: |
          mkdir -p $HOME/.android/avd
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86" --force
          printf 'hw.cpu.ncore=2\n' >> $HOME/.android/avd/test.avd/config.ini

      # 🔟 Iniciar emulador Android
      - name: Start Android Emulator
        if: env.DEVICE == 'emulator'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -accel off

      # 1️⃣1️⃣ Executar testes Android (real ou emulator)
      - name: Run Android Tests
        if: env.PLATFORM == 'android'
        run: npx wdio run wdio.conf.js

  ios-tests:
    runs-on: macos-latest
    env:
      PLATFORM: ios
      DEVICE: emulator

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Instalar dependências
      - name: Install dependencies
        run: npm install

      # 4️⃣ Instalar Appium
      - name: Install Appium
        run: npm install -g appium

      # 5️⃣ Atualizar driver XCUITest
      - name: Update XCUITest Driver
        run: appium driver update xcuitest || appium driver install xcuitest

      # 6️⃣ Iniciar simulador iOS
      - name: Start iOS Simulator
        if: env.DEVICE == 'emulator'
        run: |
          xcrun simctl boot "iPhone 14" || echo "Simulator already booted"
          xcrun simctl list devices

      # 7️⃣ Executar testes iOS
      - name: Run iOS Tests
        if: env.PLATFORM == 'ios'
        run: npx wdio run wdio.conf.js

  generate-allure-report:
    runs-on: ubuntu-latest
    needs: [android-tests, ios-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: allure-report
