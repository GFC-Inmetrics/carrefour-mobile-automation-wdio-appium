name: Mobile Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Setup Java 17 (necessário para sdkmanager)
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 4️⃣ Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 5️⃣ Instalar Appium globalmente
      - name: Install Appium
        run: npm install -g appium

      # 6️⃣ Instalar ou atualizar driver uiautomator2
      - name: Install Appium and Update UIAutomator2 Driver
        run: |
          npm install -g appium
          appium driver update uiautomator2 || appium driver install uiautomator2

      # 7️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          target: android-30
          arch: x86
          force-accept-licenses: true

      # 8️⃣ Instalar system image x86 necessária
      - name: Install Android System Image
        run: sdkmanager "system-images;android-30;google_apis;x86"

      # 9️⃣ Criar AVD (emulador x86)
      - name: Create Emulator
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86" --force
          echo "hw.cpu.ncore=2" >> $HOME/.android/avd/test.avd/config.ini

      # 🔟 Iniciar emulador
      - name: Start Emulator
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          nohup $ANDROID_HOME/emulator/emulator -avd test -no-snapshot-load -no-window -accel off &
          adb wait-for-device
          adb shell input keyevent 82

      # 1️⃣1️⃣ Rodar testes
      - name: Run Tests
        run: npx wdio run wdio.conf.js

      # 1️⃣2️⃣ Gerar relatório Allure
      - name: Generate Allure Report
        run: |
          npx allure generate allure-results --clean -o allure-report
          npx allure open allure-report
