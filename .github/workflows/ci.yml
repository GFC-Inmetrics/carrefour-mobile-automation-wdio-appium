name: Mobile Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Setup Java 17 (necessário para sdkmanager v16+)
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 4️⃣ Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 5️⃣ Instalar Appium globalmente e atualizar driver uiautomator2
      - name: Install Appium and UIAutomator2 Driver
        run: |
          npm install -g appium@latest
          if ! appium driver list --installed | grep -q uiautomator2; then
            echo "Instalando uiautomator2..."
            appium driver install uiautomator2
          else
            echo "Atualizando uiautomator2..."
            appium driver update uiautomator2
          fi

      # 6️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          target: android-30
          arch: x86
          force-accept-licenses: true

      # 7️⃣ Instalar system image necessária
      - name: Install Android System Image
        run: yes | sdkmanager "system-images;android-30;google_apis;x86"

      # 8️⃣ Criar AVD
      - name: Create Emulator
        run: echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86" --force

      # 9️⃣ Iniciar emulador
      - name: Start Emulator
        run: |
          nohup $ANDROID_HOME/emulator/emulator -avd test -no-snapshot-load -no-window &
          adb wait-for-device
          adb shell input keyevent 82

      # 🔟 Rodar os testes
      - name: Run Tests
        run: npx wdio run wdio.conf.js
