name: Mobile Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Setup Java 17 (necessário para sdkmanager e emulator)
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 4️⃣ Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 5️⃣ Instalar Appium globalmente
      - name: Install Appium
        run: npm install -g appium

      # 6️⃣ Instalar ou atualizar driver uiautomator2
      - name: Install/Update UIAutomator2 Driver
        run: |
          appium driver update uiautomator2 || appium driver install uiautomator2

      # 7️⃣ Criar e iniciar AVD usando o Action oficial
      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect
          force-avd-creation: true

      # 8️⃣ Rodar testes com captura de screenshots em falhas
      - name: Run Tests
        run: |
          npx wdio run wdio.conf.js

      # 9️⃣ Publicar resultados do Allure (opcional)
      - name: Publish Allure Report
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report
          npx allure open allure-report
