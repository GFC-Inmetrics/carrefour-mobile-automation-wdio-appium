name: Mobile Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ANDROID_SDK_ROOT: C:\Users\guilherme.clemente\Android\Sdk
  ANDROID_HOME: C:\Users\guilherme.clemente\Android\Sdk
  USE_ANDROID_EMULATOR: true  # Defina false se quiser pular o emulador

jobs:
  android-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      # 4️⃣ Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 5️⃣ Instalar Appium globalmente
      - name: Install Appium
        run: npm install -g appium

      # 6️⃣ Instalar ou atualizar driver uiautomator2
      - name: Install Appium UIAutomator2 Driver
        run: |
          appium driver update uiautomator2 || appium driver install uiautomator2

      # 7️⃣ Setup Android SDK e licenças
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          target: android-30
          arch: x86
          force-accept-licenses: true

      # 8️⃣ Executar emulador Android (opcional)
      - name: Run Android Emulator
        if: env.USE_ANDROID_EMULATOR == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          force-avd-creation: true
          emulator-options: -no-window -accel off
          script: |
            adb wait-for-device
            adb shell input keyevent 82

      # 9️⃣ Executar testes Android
      - name: Run Android Tests
        run: npx wdio run wdio.conf.js
        env:
          PLATFORM: android
          DEVICE: emulator  # ou 'real' se quiser dispositivo físico

      # 🔟 Gerar relatório Allure
      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      # 1️⃣1️⃣ Publicar relatório (opcional)
      - name: Publish Allure Report
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: allure-report

  ios-tests:
    runs-on: macos-latest
    if: runner.os == 'macOS'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Appium
        run: npm install -g appium

      # iOS Simulator (não precisa de sudo)
      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 14"
          xcrun simctl list devices

      - name: Run iOS Tests
        run: npx wdio run wdio.conf.js
        env:
          PLATFORM: ios
          DEVICE: emulator

      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publish Allure Report
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: allure-report
